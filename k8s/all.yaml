# =======================
# Namespace
# =======================
apiVersion: v1
kind: Namespace
metadata:
  name: storage
---
# =======================
# RustFS PVC
# =======================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-pvc
  namespace: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
# =======================
# RustFS Deployment
# =======================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          args:
            - "--access-key"
            - "rustfsadmin"
            - "--secret-key"
            - "rustfsadmin"
            - "--console-enable"
            - "/data"
          env:
            - name: RUSTFS_ACCESS_KEY
              value: rustfsadmin
            - name: RUSTFS_SECRET_KEY
              value: rustfsadmin
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: rustfs-data
              mountPath: /data
      volumes:
        - name: rustfs-data
          persistentVolumeClaim:
            claimName: rustfs-pvc
---
# =======================
# RustFS Service
# =======================
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: storage
spec:
  type: NodePort
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
      nodePort: 30100
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30101
---
# =======================
# Upload Deployment (RustFS only)
# =======================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload
  namespace: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upload
  template:
    metadata:
      labels:
        app: upload
    spec:
      containers:
        - name: upload
          image: mukhtarovich/upload-rustfs:1.1.0
          ports:
            - containerPort: 3000
          env:
            # ===== DATABASE =====
            - name: DATABASE_URL
              value: postgresql://neondb_owner:npg_kuhUNl6RjA7K@ep-hidden-star-ahjdsr9x-pooler.c-3.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require

            # ===== RUSTFS =====
            - name: RUSTFS_ENDPOINT
              value: http://192.168.3.151:30100
            - name: RUSTFS_ACCESS_KEY
              value: rustfsadmin
            - name: RUSTFS_SECRET_KEY
              value: rustfsadmin
            - name: RUSTFS_BUCKET
              value: uploads
            - name: RUSTFS_PRIVATE_BUCKET
              value: private
            - name: RUSTFS_PUBLIC_URL
              value: http://192.168.3.151:30100
---
# =======================
# Upload Service
# =======================
apiVersion: v1
kind: Service
metadata:
  name: upload
  namespace: storage
spec:
  type: NodePort
  selector:
    app: upload
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300